agent_name: searchclaw_raes_gate
mode: searchclaw_raes_gate
model: ""
temperature: 0
budget: medium
settings_path: config/settings.yaml
cache_dir: outputs/cache
use_hooks: true
hooks:
  raes_evidence_gate: true

trajectory:
  capture_full_text: true
  max_tool_result_chars: 20000

training_export:
  format: messages_jsonl

raes_gate:
  enabled: true
  mode: blind
  max_gate_iterations: 3

  rule_gate:
    enabled: true
    min_sources: 3
    min_independent_domains: 2
    require_primary_source: true
    max_single_domain_ratio: 0.7
    min_answer_chars: 300
    fail_fast_on_rule_fail: true

  facet_gate:
    enabled: true
    predict_facets: true
    block_on_missing_critical_facet: true

  citation_gate:
    enabled: true
    extract_claims: true
    block_on_contradicted_claim: true
    block_on_unsupported_critical_claim: true

  uncertainty_gate:
    enabled: true
    require_uncertainty_for_low_evidence: true
    require_conflict_disclosure: true

  stop_gate:
    enabled: true
    allow_abstain: true
    final_with_uncertainty_when_budget_exhausted: true
